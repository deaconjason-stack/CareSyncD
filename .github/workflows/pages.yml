name: Deploy CareSyncD Permanent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Reconstruct verified release
        shell: bash
        run: |
          set -euo pipefail
          cat \
            release/parts/part00.b64 \
            release/parts/part01.b64 \
            release/parts/part02.b64 \
            release/parts/part03.b64 \
            release/tail/tail00.b64 \
            release/tail/tail01.b64 \
            release/tail/tail02.b64 > release/caresyncd.b64
          base64 --decode release/caresyncd.b64 > release/CareSyncD-Permanent-v3.1.0.zip
          echo '0e8e2bd52b89cde3b31a29de11014b27c739f7ef9d62c4ce2a8c2f8fba03de07  release/CareSyncD-Permanent-v3.1.0.zip' | sha256sum --check
          rm -rf site
          mkdir site
          unzip -q release/CareSyncD-Permanent-v3.1.0.zip -d site

      - name: Verify build before publish
        working-directory: site
        run: |
          npm test
          npm run check
          npm run check:site
          npm run check:production

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
