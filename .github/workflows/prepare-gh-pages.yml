name: Prepare CareSyncD gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Reconstruct verified release
        shell: bash
        run: |
          set -euo pipefail
          cat release/parts/part00.b64 release/parts/part01.b64 release/parts/part02.b64 release/parts/part03.b64 release/tail/tail00.b64 release/tail/tail01.b64 release/tail/tail02.b64 > release/caresyncd.b64
          base64 --decode release/caresyncd.b64 > release/CareSyncD-Permanent-v3.1.0.zip
          echo '0e8e2bd52b89cde3b31a29de11014b27c739f7ef9d62c4ce2a8c2f8fba03de07  release/CareSyncD-Permanent-v3.1.0.zip' | sha256sum --check
          rm -rf site && mkdir site
          unzip -q release/CareSyncD-Permanent-v3.1.0.zip -d site

      - name: Verify exact build
        working-directory: site
        run: |
          npm test
          npm run check
          npm run check:site
          npm run check:production

      - name: Publish clean static branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/caresyncd-site
          cp -R site /tmp/caresyncd-site
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R /tmp/caresyncd-site/. .
          rm -rf tests scripts package.json
          touch .nojekyll
          git add -A
          git commit -m 'deploy: publish CareSyncD Permanent static site'
          git push --force origin gh-pages
