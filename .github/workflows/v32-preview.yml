name: CareSyncD v3.2 Preview Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - v3.2-living-hospital
    paths:
      - .ci/v32-preview-trigger.txt

permissions:
  contents: write

concurrency:
  group: caresyncd-v32-preview
  cancel-in-progress: false

jobs:
  verify-and-publish-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out verified v3.2 source
        uses: actions/checkout@v4
        with:
          ref: v3.2-living-hospital
          path: source
          fetch-depth: 0

      - name: Check out current production Pages branch separately
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify complete v3.2 suite
        working-directory: source/web
        run: node --test tests/v32/*.test.js

      - name: Verify preserved v3.1 tests
        working-directory: source/web
        run: npm test

      - name: Verify project integrity
        working-directory: source/web
        run: npm run check

      - name: Verify PWA/site contract
        working-directory: source/web
        run: npm run check:site

      - name: Verify production safety checks
        working-directory: source/web
        run: npm run check:production

      - name: Stage only the isolated v3.2 preview directory
        shell: bash
        run: |
          set -euo pipefail
          TARGET_REL="v32-preview"
          [ "$TARGET_REL" = "v32-preview" ]
          [ -d source/web ]
          [ -d pages/.git ]
          TARGET="pages/$TARGET_REL"
          [ "$TARGET" = "pages/v32-preview" ]
          rm -rf "$TARGET"
          mkdir -p "$TARGET"
          rsync -a \
            --exclude 'node_modules/' \
            --exclude 'tests/' \
            --exclude 'scripts/' \
            source/web/ "$TARGET/"
          test -f pages/v32-preview/index.html
          grep -qi 'CareSyncD v3.2 Preview' pages/v32-preview/index.html

      - name: Publish CareSyncD v3.2 preview without changing production root
        shell: bash
        run: |
          set -euo pipefail
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- v32-preview
          if git diff --cached --quiet; then
            echo "CareSyncD v3.2 preview already matches the verified source."
            exit 0
          fi
          git commit -m "preview: publish verified CareSyncD v3.2"
          git push origin HEAD:gh-pages
