name: CareSyncD v3.2 Verification Gate

on:
  push:
    branches: [v3.2-living-hospital]
    paths: [.ci/v32-gate.txt]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Read verification gate mode
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          marker="$(tr -d '\r\n' < .ci/v32-gate.txt)"
          if [[ "$marker" =~ ^RED[[:space:]]+(tests/v32/[A-Za-z0-9._-]+\.test\.js)$ ]]; then
            echo "mode=red" >> "$GITHUB_OUTPUT"
            echo "target=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "Expected RED checkpoint: ${BASH_REMATCH[1]}"
          elif [[ "$marker" == RED* ]]; then
            echo "::error::Invalid RED marker. Use: RED tests/v32/<name>.test.js"
            exit 1
          else
            echo "mode=green" >> "$GITHUB_OUTPUT"
            echo "Standard GREEN verification checkpoint"
          fi
      - name: Verify preserved v3.1 archive checksum
        shell: bash
        run: |
          set -euo pipefail
          cat release/parts/part00.b64 release/parts/part01.b64 release/parts/part02.b64 release/parts/part03.b64 release/tail/tail00.b64 release/tail/tail01.b64 release/tail/tail02.b64 > /tmp/caresyncd-v31.b64
          base64 --decode /tmp/caresyncd-v31.b64 > /tmp/CareSyncD-Permanent-v3.1.0.zip
          echo '0e8e2bd52b89cde3b31a29de11014b27c739f7ef9d62c4ce2a8c2f8fba03de07  /tmp/CareSyncD-Permanent-v3.1.0.zip' | sha256sum --check
      - name: Confirm expected RED test fails
        if: steps.gate.outputs.mode == 'red'
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          target="${{ steps.gate.outputs.target }}"
          if [[ ! -f "$target" ]]; then
            echo "::error::Expected RED target does not exist: $target"
            exit 1
          fi
          set +e
          node --test "$target"
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "::error::Expected RED test passed unexpectedly: $target"
            exit 1
          fi
          echo "Expected RED confirmed: $target failed as intended."
      - name: Run v3.2 Living Hospital tests twice
        if: steps.gate.outputs.mode == 'green'
        working-directory: web
        run: |
          node --test tests/v32/*.test.js
          node --test tests/v32/*.test.js
      - name: Run npm test
        if: steps.gate.outputs.mode == 'green'
        working-directory: web
        run: npm test
      - name: Run npm run check
        if: steps.gate.outputs.mode == 'green'
        working-directory: web
        run: npm run check
      - name: Run npm run check:site
        if: steps.gate.outputs.mode == 'green'
        working-directory: web
        run: npm run check:site
      - name: Run npm run check:production
        if: steps.gate.outputs.mode == 'green'
        working-directory: web
        run: npm run check:production
